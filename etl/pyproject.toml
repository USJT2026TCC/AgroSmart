[project]
name = "agrosmart-etl"
version = "0.1.0"
description = "ETL historico do INMET: extracao, validacao e consolidacao de precipitacao"
requires-python = ">=3.10"
dependencies = ["requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
etl = "etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Formatação e análise estática do código Python.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Erros, avisos, ordem dos imports, sintaxe moderna e padroes que costumam ser defeito.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["etl"]
