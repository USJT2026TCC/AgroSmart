<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1240" viewBox="0 0 920 1240" role="img" aria-labelledby="titulo descricao">
<title id="titulo">AgroSmart — fluxo histórico</title><desc id="descricao">Dados históricos do INMET de 01/01/2020 a 30/09/2026, ETL Python, pacote de CSVs, importação pela API no PostgreSQL, avaliação pelo oráculo e pagamento integral em contrato na Sepolia. A interface consulta a API e a blockchain. A emissão da apólice e o depósito da garantia acontecem antes da avaliação.</desc>
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="2"/></marker></defs>
<rect width="920" height="1240" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif"><text x="60" y="50" font-size="29" font-weight="bold" fill="#163e31">AgroSmart · fluxo histórico</text><text x="60" y="80" font-size="17" fill="#475569">São Simão/SP · A770 · 01/01/2020 a 30/09/2026 (UTC)</text>
<rect x="60" y="110" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="158" r="21" fill="#166349"/><text x="100" y="165" text-anchor="middle" fill="white" font-size="21">1</text><text x="140" y="147" font-size="22" font-weight="bold" fill="#18382d">INMET</text><text x="140" y="178" font-size="17" fill="#475569">Arquivos meteorológicos históricos da estação A770</text>
<path d="M460,211 V232" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="242" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="290" r="21" fill="#166349"/><text x="100" y="297" text-anchor="middle" fill="white" font-size="21">2</text><text x="140" y="279" font-size="22" font-weight="bold" fill="#18382d">ETL em Python</text><text x="140" y="310" font-size="17" fill="#475569">Extrai, valida e consolida sem alterar as datas</text>
<path d="M460,343 V364" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="374" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="422" r="21" fill="#166349"/><text x="100" y="429" text-anchor="middle" fill="white" font-size="21">3</text><text x="140" y="411" font-size="22" font-weight="bold" fill="#18382d">Pacote público no Git</text><text x="140" y="442" font-size="17" fill="#475569">CSVs originais, diário e manifesto com hashes</text>
<path d="M460,475 V496" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="506" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="554" r="21" fill="#166349"/><text x="100" y="561" text-anchor="middle" fill="white" font-size="21">4</text><text x="140" y="543" font-size="22" font-weight="bold" fill="#18382d">API → PostgreSQL no Docker</text><text x="140" y="574" font-size="17" fill="#475569">Importação automática; volume local persistente</text>
<path d="M460,607 V628" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="638" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="686" r="21" fill="#166349"/><text x="100" y="693" text-anchor="middle" fill="white" font-size="21">5</text><text x="140" y="675" font-size="22" font-weight="bold" fill="#18382d">Oráculo consulta pela API</text><text x="140" y="706" font-size="17" fill="#475569">Confere termos e calcula a sequência seca na cobertura</text>
<path d="M460,739 V760" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="770" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="818" r="21" fill="#166349"/><text x="100" y="825" text-anchor="middle" fill="white" font-size="21">6</text><text x="140" y="807" font-size="22" font-weight="bold" fill="#18382d">Contrato na Sepolia</text><text x="140" y="838" font-size="17" fill="#475569">Valida acesso, data e gatilho; paga o valor integral uma vez</text>
<path d="M460,871 V892" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="902" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="950" r="21" fill="#166349"/><text x="100" y="957" text-anchor="middle" fill="white" font-size="21">7</text><text x="140" y="939" font-size="22" font-weight="bold" fill="#18382d">Indexador → API</text><text x="140" y="970" font-size="17" fill="#475569">Acompanha eventos e confirmações da blockchain</text>
<path d="M460,1003 V1024" stroke="#64748b" stroke-width="2" marker-end="url(#seta)"/>
<rect x="60" y="1034" width="800" height="100" rx="13" fill="#ffffff" stroke="#cbd5e1"/><circle cx="100" cy="1082" r="21" fill="#166349"/><text x="100" y="1089" text-anchor="middle" fill="white" font-size="21">8</text><text x="140" y="1071" font-size="22" font-weight="bold" fill="#18382d">Aplicação web</text><text x="140" y="1102" font-size="17" fill="#475569">Consulta a API e lê termos e eventos na Sepolia</text>
<text x="60" y="1197" font-size="16" fill="#334155">Antes da avaliação: emissão e garantia assinadas na MetaMask da seguradora.</text></g></svg>