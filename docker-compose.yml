services:
  banco:
    image: postgis/postgis:16-3.4
    container_name: agrosmart-banco
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrosmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrosmart_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agrosmart}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - dados_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dados_pg:
